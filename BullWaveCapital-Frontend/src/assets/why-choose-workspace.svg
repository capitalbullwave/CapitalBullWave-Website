<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none" role="img" aria-label="Market research workspace">
  <defs>
    <linearGradient id="bg" x1="0" y1="640" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="42%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="panel" x1="80" y1="120" x2="880" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="line" x1="150" y1="420" x2="820" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0284C7" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="960" height="640" rx="48" fill="url(#bg)"/>

  <!-- soft orbs -->
  <circle cx="780" cy="120" r="140" fill="#7DD3FC" fill-opacity="0.35"/>
  <circle cx="180" cy="520" r="120" fill="#38BDF8" fill-opacity="0.18"/>

  <!-- main dashboard panel -->
  <g filter="url(#soft)">
    <rect x="90" y="110" width="780" height="420" rx="28" fill="url(#panel)" stroke="#BAE6FD" stroke-width="2"/>
  </g>

  <!-- sidebar -->
  <rect x="118" y="138" width="150" height="364" rx="18" fill="#F0F9FF" stroke="#E0F2FE"/>
  <rect x="138" y="168" width="110" height="14" rx="7" fill="#7DD3FC" fill-opacity="0.7"/>
  <rect x="138" y="206" width="90" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="138" y="230" width="100" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="138" y="254" width="80" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="138" y="310" width="110" height="48" rx="12" fill="#0EA5E9" fill-opacity="0.14"/>
  <rect x="138" y="376" width="110" height="48" rx="12" fill="#E2E8F0"/>

  <!-- chart area -->
  <rect x="292" y="138" width="548" height="250" rx="18" fill="#FFFFFF" stroke="#E0F2FE"/>
  <!-- grid lines -->
  <path d="M320 190H812 M320 240H812 M320 290H812 M320 340H812" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- candles -->
  <g stroke-linecap="round">
    <line x1="360" y1="210" x2="360" y2="320" stroke="#94A3B8" stroke-width="2"/>
    <rect x="350" y="230" width="20" height="70" rx="3" fill="#38BDF8"/>
    <line x1="420" y1="200" x2="420" y2="300" stroke="#94A3B8" stroke-width="2"/>
    <rect x="410" y="215" width="20" height="55" rx="3" fill="#0EA5E9"/>
    <line x1="480" y1="230" x2="480" y2="335" stroke="#94A3B8" stroke-width="2"/>
    <rect x="470" y="255" width="20" height="60" rx="3" fill="#7DD3FC"/>
    <line x1="540" y1="195" x2="540" y2="290" stroke="#94A3B8" stroke-width="2"/>
    <rect x="530" y="210" width="20" height="55" rx="3" fill="#0284C7"/>
    <line x1="600" y1="220" x2="600" y2="310" stroke="#94A3B8" stroke-width="2"/>
    <rect x="590" y="235" width="20" height="50" rx="3" fill="#38BDF8"/>
    <line x1="660" y1="180" x2="660" y2="275" stroke="#94A3B8" stroke-width="2"/>
    <rect x="650" y="195" width="20" height="55" rx="3" fill="#0EA5E9"/>
    <line x1="720" y1="205" x2="720" y2="300" stroke="#94A3B8" stroke-width="2"/>
    <rect x="710" y="220" width="20" height="60" rx="3" fill="#38BDF8"/>
    <line x1="780" y1="170" x2="780" y2="260" stroke="#94A3B8" stroke-width="2"/>
    <rect x="770" y="185" width="20" height="50" rx="3" fill="#0284C7"/>
  </g>
  <!-- trend line -->
  <path d="M340 310 C400 290 450 250 520 255 C590 260 640 210 700 200 C760 190 800 175 820 165" stroke="url(#line)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="820" cy="165" r="7" fill="#0EA5E9"/>
  <circle cx="820" cy="165" r="12" fill="#0EA5E9" fill-opacity="0.2"/>

  <!-- bottom metric cards -->
  <rect x="292" y="408" width="168" height="86" rx="16" fill="#F0F9FF" stroke="#BAE6FD"/>
  <rect x="312" y="430" width="70" height="10" rx="5" fill="#94A3B8"/>
  <rect x="312" y="452" width="100" height="16" rx="6" fill="#0EA5E9"/>

  <rect x="482" y="408" width="168" height="86" rx="16" fill="#FFFFFF" stroke="#E0F2FE"/>
  <rect x="502" y="430" width="70" height="10" rx="5" fill="#94A3B8"/>
  <rect x="502" y="452" width="100" height="16" rx="6" fill="#38BDF8"/>

  <rect x="672" y="408" width="168" height="86" rx="16" fill="#FFFFFF" stroke="#E0F2FE"/>
  <rect x="692" y="430" width="70" height="10" rx="5" fill="#94A3B8"/>
  <rect x="692" y="452" width="100" height="16" rx="6" fill="#0284C7"/>
</svg>
